<style>
    *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fff8fb;
}

/* NAVBAR */


/* Navbar */

header {
    width: 100%;
    height: 85px;
    background-color: #ffdce6;

    display: flex;
    align-items: center;
    justify-content: space-around;

    padding: 10px 20px;
    box-sizing: border-box;

    border-radius: 15px;
    box-shadow: 0 4px 12px rgba(180, 80, 110, 0.15);
}


/* Logo */

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo i {
    font-size: 40px;
    color: #e40f6f;
}

.logo h2 {
    margin: 0;
    font-size: 25px;
    color:#e40f6f;
    font-family: Georgia, serif;
}

.logo p {
    margin: 3px 0 0;
    font-size: 13px;
    color: #e40f6f;
}


/* Navigation */

nav {
    display: flex;
    gap: 30px;
}

nav a {
    text-decoration: none;
    color: #e40f6f;
    font-size: 16px;
    font-weight: bold;
}

nav a:hover {
    color: #000000;
}


/* Icons */

.icons {
    display: flex;
    gap: 20px;
}

.icons i {
    font-size: 20px;
    color:#e40f6f;
    cursor: pointer;
}

.icons i:hover {
    color: #f5d1db;
}


</style>
<body>
    <header>

    <div class="logo">

        <div>

    </div>

    </nav>

    <div class="icons">
        <i class="fa-solid fa-magnifying-glass"></i> 

        <i class="fa-solid fa-cart-shopping"></i>


        <i class="fa-regular fa-user"></i>
    </div>

</header>


    
</body>
